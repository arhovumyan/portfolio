    <circle cx="96" cy="14" r="1.2"/>
    <circle cx="150" cy="32" r="1.6"/>
    <circle cx="286" cy="18" r="1.2"/>
    <circle cx="338" cy="38" r="1.6"/>
    <circle cx="404" cy="22" r="1.2"/>
