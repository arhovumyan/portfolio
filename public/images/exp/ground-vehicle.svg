<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="Autonomous ground vehicle — drone, rover, and ground station telemetry">
  <!-- ground plane -->
  <g fill="none" stroke="#839cb5" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M8 138h464"/>
  </g>

  <!-- drone on the telemetry link -->
  <g fill="none" stroke="#d9ecff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 34l16 12M112 34l-16 12"/>
    <rect x="70" y="42" width="24" height="16" rx="5"/>
  </g>
  <g fill="none" stroke="#839cb5" stroke-width="1.8">
    <ellipse cx="52" cy="34" rx="16" ry="4"/>
    <ellipse cx="112" cy="34" rx="16" ry="4"/>
    <circle cx="82" cy="64" r="4"/>
  </g>

  <!-- bare-metal microcontroller: registers poked directly -->
  <g fill="none" stroke="#839cb5" stroke-width="1.8" stroke-linejoin="round" opacity="0.85">
    <rect x="46" y="98" width="34" height="30" rx="3"/>
    <path d="M46 106h-8M46 113h-8M46 120h-8M80 106h8M80 113h8M80 120h8"/>
  </g>
  <g fill="none" stroke="#a259ff" stroke-width="1.8" stroke-linejoin="round">
    <rect x="56" y="108" width="14" height="10" rx="2"/>
  </g>

  <!-- rover -->
  <g fill="none" stroke="#d9ecff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 122h84l-8-24h-26l-8-12h-30z"/>
  </g>
  <g fill="none" stroke="#839cb5" stroke-width="2">
    <circle cx="172" cy="129" r="9"/>
    <circle cx="202" cy="129" r="9"/>
    <circle cx="232" cy="129" r="9"/>
    <circle cx="172" cy="129" r="3"/>
    <circle cx="202" cy="129" r="3"/>
    <circle cx="232" cy="129" r="3"/>
  </g>
  <g fill="none" stroke="#839cb5" stroke-width="2" stroke-linecap="round">
    <path d="M226 98V76"/>
    <circle cx="226" cy="73" r="3"/>
  </g>

  <!-- ground station: mast + telemetry screen -->
  <g fill="none" stroke="#839cb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M348 138V74M338 138l10-64 10 64M340 110h16"/>
  </g>
  <g fill="none" stroke="#4cc0f0" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M337 64a16 16 0 0 1 22 0M331 55a28 28 0 0 1 34 0"/>
  </g>
  <g fill="none" stroke="#d9ecff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="398" y="88" width="62" height="40" rx="4"/>
    <path d="M419 138h20M429 128v10"/>
  </g>
  <g fill="none" stroke="#a259ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M406 118l11-14 9 10 8-13 12 15"/>
  </g>

  <!-- telemetry: drone and rover both reporting to the station -->
  <g fill="none" stroke="#4cc0f0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.8">
    <path d="M104 42C180 24 286 30 336 56"/>
    <path d="M234 68C266 58 310 62 336 72"/>
  </g>
</svg>
